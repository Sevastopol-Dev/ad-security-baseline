# ==============================================================================
# ad-cloud-security-baseline / .github / workflows / security-lint.yml
# Automated Infrastructure-as-Code Security & Quality Linter
# ==============================================================================

name: "Terraform Security & Lint Pipeline"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-lint:
    name: "TFLint & Format Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Verify Terraform Formatting
        run: terraform fmt -check -recursive
        continue-on-error: false

      - name: Initialize Terraform (Validate Syntax & Providers)
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint Security & Best Practice Analysis
        run: |
          cd terraform
          tflint --init
          tflint --format=compact
      
  checkov:
    name: Checkov IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          output_format: cli
          fail_on_severity: HIGH
          soft_fail: false # Set to false if you want failures to block the pipeline